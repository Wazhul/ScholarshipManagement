<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScholarGate | Registration Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --gradient-start: #3b82f6;
            --gradient-end: #6366f1;
        }
        
        body {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        
        .registration-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }
        
        .role-tab {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .role-tab.active {
            background: var(--primary-color) !important;
            color: white !important;
        }
        
        .password-strength {
            height: 3px;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8">
                <div class="registration-card">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-4">
                            <i class="fas fa-user-plus"></i> Create Account
                        </h2>

                        {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                            <div class="alert alert-{{ category }} d-flex align-items-center" role="alert">
                                <i class="fas fa-{% if category == 'success' %}check-circle{% else %}exclamation-triangle{% endif %} me-2"></i>
                                {{ message }}
                            </div>
                            {% endfor %}
                        {% endif %}
                        {% endwith %}

                        <div class="role-selection mb-4">
                            <div class="btn-group w-100 shadow-sm">
                                <button type="button" class="btn btn-outline-primary role-tab active" data-role="student">Student</button>
                                <button type="button" class="btn btn-outline-primary role-tab" data-role="institution">Institution</button>
                                <button type="button" class="btn btn-outline-primary role-tab" data-role="donor">Donor</button>
                                <button type="button" class="btn btn-outline-primary role-tab" data-role="admin">Admin</button>
                            </div>
                        </div>

                        <form method="post" action="{{ url_for('register') }}" id="registrationForm">
                            <!-- Common Fields -->
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="hidden" name="role" id="roleInput" value="student">
                                        <input type="text" class="form-control" name="username" placeholder="Username" required>
                                        <label><i class="fas fa-user me-2"></i>Username</label>
                                    </div>
                                </div>
                                
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="email" class="form-control" name="email" placeholder="Email" required>
                                        <label><i class="fas fa-envelope me-2"></i>Email</label>
                                    </div>
                                </div>
                            </div>

                            <div class="row g-3 mt-2">
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="password" class="form-control" name="password" id="password" placeholder="Password" required>
                                        <label><i class="fas fa-lock me-2"></i>Password</label>
                                        <div class="password-strength mt-1 bg-secondary"></div>
                                    </div>
                                </div>
                                
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" name="wallet_address" 
                                               pattern="^0x[a-fA-F0-9]{40}$" placeholder="Wallet Address" required>
                                        <label><i class="fas fa-wallet me-2"></i>Wallet Address</label>
                                    </div>
                                </div>
                            </div>

                            <!-- Role-Specific Fields -->
                            <!-- Student Fields -->
                            <div class="role-section" data-role="student">
                                <div class="row g-3 mt-3">
                                    <div class="col-md-6">
                                        <div class="form-floating">
                                            <input type="text" class="form-control" name="institution" placeholder="Institution">
                                            <label><i class="fas fa-university me-2"></i>Institution</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-floating">
                                            <input type="number" step="0.01" class="form-control" name="gpa" 
                                                   min="0" max="4.0" placeholder="GPA">
                                            <label><i class="fas fa-star me-2"></i>Current GPA</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Institution Fields -->
                            <div class="role-section" data-role="institution" style="display: none;">
                                <div class="row g-3 mt-3">
                                    <div class="col-md-6">
                                        <div class="form-floating">
                                            <input type="text" class="form-control" name="institution_name" 
                                                   placeholder="Institution Name">
                                            <label><i class="fas fa-building me-2"></i>Institution Name</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-floating">
                                            <input type="text" class="form-control" name="license_number" 
                                                   placeholder="License Number">
                                            <label><i class="fas fa-id-card me-2"></i>License Number</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Donor Fields -->
                            <div class="role-section" data-role="donor" style="display: none;">
                                <div class="row g-3 mt-3">
                                    <div class="col-md-6">
                                        <div class="form-floating">
                                            <input type="text" class="form-control" name="organization" 
                                                   placeholder="Organization">
                                            <label><i class="fas fa-briefcase me-2"></i>Organization</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-floating">
                                            <select class="form-select" name="donation_type">
                                                <option value="one-time">One-time</option>
                                                <option value="recurring">Recurring</option>
                                            </select>
                                            <label><i class="fas fa-hand-holding-usd me-2"></i>Donation Type</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Admin Fields -->
                            <div class="role-section" data-role="admin" style="display: none;">
                                <div class="row g-3 mt-3">
                                    <div class="col-12">
                                        <div class="form-floating">
                                            <input type="text" class="form-control" name="admin_code" 
                                                   placeholder="Admin Code">
                                            <label><i class="fas fa-key me-2"></i>Admin Access Code</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="mt-4">
                                <button type="submit" class="btn btn-primary w-100 py-2">
                                    <i class="fas fa-user-plus me-2"></i>Create Account
                                </button>
                            </div>
                        </form>

                        <div class="text-center mt-4">
                            <p class="mb-0">Already have an account? 
                                <a href="{{ url_for('login') }}" class="text-primary">Login here</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Role Selection Logic
        document.querySelectorAll('.role-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                const role = tab.dataset.role;
                document.querySelectorAll('.role-section').forEach(section => {
                    section.style.display = section.dataset.role === role ? 'block' : 'none';
                });
                document.getElementById('roleInput').value = role;
            });
        });

        // Password Strength Indicator
        document.getElementById('password').addEventListener('input', function(e) {
            const strength = Math.min(e.target.value.length / 12 * 100, 100);
            document.querySelector('.password-strength').style.width = strength + '%';
            document.querySelector('.password-strength').style.backgroundColor = 
                strength < 50 ? '#dc3545' : strength < 80 ? '#ffc107' : '#28a745';
        });
    </script>
</body>
</html>
