<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScholarGate | Secure Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --gradient-start: #3b82f6;
            --gradient-end: #6366f1;
        }
        
        body {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }
        
        .auth-header {
            background: var(--primary-color);
            padding: 2rem;
            color: white;
            text-align: center;
        }
        
        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
        }
        
        .social-login .btn {
            transition: transform 0.3s ease;
        }
        
        .social-login .btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="login-card">
                    <div class="auth-header">
                        <h2 class="mb-3"><i class="fas fa-graduation-cap"></i> ScholarGate</h2>
                        <p class="mb-0">Access your scholarship portal</p>
                    </div>

                    <div class="card-body p-5">
                        {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                            <div class="alert alert-{{ category }} d-flex align-items-center" role="alert">
                                <i class="fas fa-{% if category == 'success' %}check-circle{% else %}exclamation-triangle{% endif %} me-2"></i>
                                {{ message }}
                            </div>
                            {% endfor %}
                        {% endif %}
                        {% endwith %}

                        <form method="post" action="{{ url_for('login') }}" class="needs-validation" novalidate>
                            <div class="mb-4">
                                <label class="form-label">Select Role</label>
                                <div class="btn-group w-100 shadow-sm" id="roleGroup">
                                    <input type="hidden" name="role" id="selectedRole" value="student" required>
                                    <button type="button" class="btn btn-outline-primary active" 
                                            data-role="student" onclick="selectRole(this)">Student</button>
                                    <button type="button" class="btn btn-outline-primary" 
                                            data-role="institution" onclick="selectRole(this)">Institution</button>
                                    <button type="button" class="btn btn-outline-primary" 
                                            data-role="donor" onclick="selectRole(this)">Donor</button>
                                    <button type="button" class="btn btn-outline-primary" 
                                            data-role="admin" onclick="selectRole(this)">Admin</button>
                                </div>
                            </div>

                            </div>

                            <div class="mb-4">
                                <label for="username" class="form-label">Username or Wallet Address</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                                    <input type="text" class="form-control" name="username" placeholder="Enter username or 0x..." required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control" name="password" placeholder="Enter password" required>
                                </div>
                                <a href="#forgot-password" class="small text-muted float-end mt-2">Forgot Password?</a>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                                <i class="fas fa-sign-in-alt me-2"></i>Login
                            </button>

                            <div class="text-center mb-4 text-muted position-relative">
                                <span class="bg-white px-2">or continue with</span>
                            </div>

                            <div class="social-login row g-2 mb-4">
                                <div class="col">
                                    <button type="button" class="btn btn-outline-dark w-100">
                                        <i class="fab fa-google"></i> Google
                                    </button>
                                </div>
                                <div class="col">
                                    <button type="button" class="btn btn-outline-dark w-100">
                                        <i class="fab fa-github"></i> GitHub
                                    </button>
                                </div>
                                <div class="col">
                                    <button type="button" class="btn btn-outline-dark w-100">
                                        <i class="fab fa-ethereum"></i> Wallet
                                    </button>
                                </div>
                            </div>

                            <div class="text-center">
                                <p class="mb-0">Don't have an account? 
                                    <a href="{{ url_for('register') }}" class="text-primary">Create account</a>
                                </p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Role Selection Logic
        function selectRole(button) {
            // Remove active class from all buttons
            document.querySelectorAll('#roleGroup button').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Add active class to clicked button
            button.classList.add('active');
            
            // Update hidden input value
            document.getElementById('selectedRole').value = button.dataset.role;
        }

        // Form Validation
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            if (!document.getElementById('selectedRole').value) {
                alert('Please select a role');
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
